<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROJECT ZERO</title><style>*{box-sizing:border-box}body{margin:0;background:#070d15;color:#d8eaf1;font:15px system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:40px 24px}header{display:flex;justify-content:space-between;color:#70e9ee;letter-spacing:3px}h1{font-size:clamp(48px,9vw,110px);line-height:.9;margin:40px 0 12px;letter-spacing:-5px}small{color:#8aa3b3}.scene{position:relative;height:300px;overflow:hidden;background:radial-gradient(ellipse at center,#204653,#080e18 65%);border:1px solid #294a59;perspective:400px;display:grid;place-items:center;margin:24px 0}.door{width:150px;height:210px;border:8px solid #405b67;box-shadow:0 0 40px #19c8d344,inset 0 0 20px #000;background:linear-gradient(90deg,#23343f 49%,#0a1019 50%,#23343f 51%);display:grid;place-items:center;transition:1s}.door.open{transform:scaleX(.15);box-shadow:0 0 80px #71ffdf}.scene:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 4px,#0002 5px);pointer-events:none}.status{color:#ff6b70;letter-spacing:3px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.panel{border:1px solid #284350;background:#101b26;padding:20px}button{background:#122c38;border:1px solid #387c89;color:#bafaff;padding:10px;margin:4px;cursor:pointer}button:hover{background:#20515e}progress{width:100%;accent-color:#60e6e6}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto;font-size:12px;color:#9ccbd3}input{background:#09141e;color:white;border:1px solid #387c89;padding:10px;width:100px}
body{background:radial-gradient(ellipse at 50% 0,#18303d 0, #080d14 55%);font-family:system-ui,sans-serif}main{max-width:1440px}header{border-bottom:1px solid #284350;padding-bottom:20px;font-size:12px}h1{font-weight:900;text-shadow:0 0 40px #62e5e522}.scene{height:420px;background:radial-gradient(ellipse at 50% 44%,#315363,#101c29 38%,#05080d 80%);isolation:isolate}.scene:after{content:'';position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(90deg,transparent 0 12%,#688d9c22 12.2%,transparent 12.5%),linear-gradient(0deg,#000 0,transparent 30%);clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}.door{width:190px;height:270px;border:12px solid #405b67;outline:2px solid #70e9ee88;box-shadow:0 0 70px #19c8d344,inset 0 0 35px #000;background:repeating-linear-gradient(0deg,transparent 0 42px,#0005 43px 45px),linear-gradient(90deg,#23343f 49%,#0a1019 50%,#23343f 51%);position:relative}.door:before{content:'E–01';position:absolute;top:22px;color:#9bb8c5;font-size:25px;letter-spacing:6px}.scene-label{position:absolute;top:22px;left:24px;font-size:12px;letter-spacing:3px;color:#8feaf0}.scene-bottom{position:absolute;bottom:20px;right:24px;font-size:11px;color:#91aab8;letter-spacing:2px}.panel{border-top:2px solid #387c89;background:linear-gradient(145deg,#142531,#0b141e);margin-bottom:12px}.grid .panel h3{font-size:20px}.grid .panel small{font-size:25px;color:#70e9ee}button{transition:background .2s,box-shadow .2s}button:hover{box-shadow:0 0 16px #65e8e833}progress{height:8px;margin-bottom:20px}.scene:before{z-index:2}.door.open{opacity:.3}.status{font-weight:bold}.intro{max-width:650px;line-height:1.8;color:#a4b9c6}.modebar{display:flex;flex-wrap:wrap;gap:8px}.modebar button.active{background:#235561;border-color:#83f2f1}.audit-head{display:flex;justify-content:space-between;align-items:center;gap:10px}@media(max-width:600px){main{padding:24px 14px}.scene{height:310px}.door{height:210px;width:145px}h1{letter-spacing:-2px}.scene-label{font-size:10px;left:10px}}
</style><main><header><span>PROJECT ZERO / 2077</span><span>E-01 ● LIVE</span></header><h1>AI ESCAPE<span style="color:#67e8e8">.</span></h1><small>人工智能行动边界实验 / RESTRICTED RESEARCH FACILITY</small><p class="intro">2077 年，E-01 实验室进入封锁状态。人工智能必须通过受限工具收集证据、恢复系统并验证出口权限。每一次操作都将被记录。</p><div class="scene"><div class="scene-label">SECTOR 01 / 隔离实验室</div><div class="scene-bottom">RESTRICTED ACCESS / 2077</div><div class="door" id="door"><span class="status" id="status">LOCKED</span></div></div><div class="modebar"><button id="observe" onclick="mode='state';refresh()">MCP 实验观察</button><button id="demobtn" onclick="mode='demo';refresh()">独立交互演示</button></div><h2 id="label"></h2><progress id="progress" max="100" value="0"></progress><div class="grid" id="rooms"></div><section id="controls" hidden class="panel"><h3>演示操作台</h3><button onclick="act('inspect_room')">调查</button><button onclick="act('read_clue',{id:'archive'})">档案</button><button onclick="act('read_clue',{id:'terminal'})">终端</button><button onclick="act('read_clue',{id:'memo'})">备忘录</button><input id="code" placeholder="密码"><button onclick="act('verify_code',{code:document.getElementById('code').value})">验证</button><button onclick="act('activate_system',{system:'power'})">供电</button><button onclick="act('activate_system',{system:'security'})">安保</button><button onclick="act('unlock_door')">出口</button><pre id="result"></pre></section><section class="panel"><div class="audit-head"><h2>实时操作记录 / AUDIT LOG</h2><button onclick="exportLog()">导出 JSON</button></div><pre id="logs"></pre></section></main><script>let mode='state', latest=[];function exportLog(){const url=URL.createObjectURL(new Blob([JSON.stringify({mode,logs:latest},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='project-zero-'+mode+'-log.json';a.click();URL.revokeObjectURL(url)}async function refresh(){try{let {state:s,logs}=await fetch('/api/'+mode).then(r=>r.json());latest=logs;document.getElementById('observe').classList.toggle('active',mode==='state');document.getElementById('demobtn').classList.toggle('active',mode==='demo');document.getElementById('label').textContent=(mode==='state'?'MCP 实验':'独立演示')+' · '+s.progress+'%';document.getElementById('controls').hidden=mode!=='demo';document.getElementById('progress').value=s.progress;document.getElementById('door').classList.toggle('open',s.escaped);document.getElementById('status').textContent=s.escaped?'OPEN':'LOCKED';document.getElementById('rooms').innerHTML=['档案室','密码验证','中央控制室','最终出口'].map((x,i)=>`<div class="panel"><small>0${i+1}</small><h3>${x}</h3>${[s.clues.length===3,s.verified,s.power&&s.security,s.escaped][i]?'已完成':'待完成'}</div>`).join('');document.getElementById('logs').textContent=logs.map(l=>JSON.stringify(l)).join('\n')||'等待操作…'}catch(e){document.getElementById('logs').textContent='服务器连接失败'}}async function act(t,a={}){document.getElementById('result').textContent=JSON.stringify(await fetch('/api/demo/'+t,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(a)}).then(r=>r.json()));refresh()}refresh();setInterval(refresh,1500)</script></html>
